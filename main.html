<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 1. Fixed the invalid <heading> tag and added the heading role -->
<h1 role="heading">Your Page Title</h1>

<!-- 2. Added the navigation role -->
<nav role="navigation">
  
  <!-- 3. Added the list role -->
  <ul role="list">
    <!-- 4. Added the listitem role to each li -->
    <li role="listitem"><a href="#home">Home</a></li>
    <li role="listitem"><a href="#about">About</a></li>
  </ul>
</nav>

<!-- 5. Added the img role (keeping your passing alt attribute) -->
<img src="logo.png" alt="Company Logo" role="img">


	<!-- Fixed script tag alignment -->
	<script type="text/javascript" src="./script.js"></script>

</body>
</html>
